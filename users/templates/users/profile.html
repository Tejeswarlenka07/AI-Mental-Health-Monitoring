<!DOCTYPE html>
<html>

<head>
    <title>My Profile - MindCare AI</title>
</head>

<body>

    <h1>My Profile</h1>

    <p>
        Username:
        {{ request.user.username }}
    </p>

    <p>
        Email:
        {{ request.user.email }}
    </p>

    <form method="POST">

        {% csrf_token %}

        <label>Age</label>
        <br>

        <input
            type="number"
            name="age"
            value="{{ profile.age|default:'' }}"
        >

        <br><br>

        <label>Bio</label>
        <br>

        <textarea name="bio">{{ profile.bio }}</textarea>

        <br><br>

        <button type="submit">
            Save Profile
        </button>

    </form>

    <br>

    <a href="{% url 'dashboard' %}">
        Dashboard
    </a>

    <br><br>

    <a href="{% url 'logout' %}">
        Logout
    </a>

</body>

</html>
