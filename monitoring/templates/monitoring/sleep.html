<!DOCTYPE html>
<html>

<head>
    <title>Sleep Tracking - MindCare AI</title>
</head>

<body>

    <h1>Sleep Tracking</h1>

    <p>Track your sleep to understand your wellness patterns.</p>

    <form method="POST">

        {% csrf_token %}

        <label>How many hours did you sleep?</label>

        <br>

        <input
            type="number"
            name="hours"
            step="0.5"
            min="0"
            max="24"
            required
        >

        <br><br>

        <label>Sleep Quality</label>

        <br>

        <select name="quality" required>

            <option value="">-- Select Quality --</option>

            <option value="1">1 - Very Poor</option>
            <option value="2">2 - Poor</option>
            <option value="3">3 - Average</option>
            <option value="4">4 - Good</option>
            <option value="5">5 - Excellent</option>

        </select>

        <br><br>

        <button type="submit">
            Save Sleep
        </button>

    </form>

    <hr>

    <h2>Previous Sleep Records</h2>

    {% for entry in sleeps %}

        <div>

            <p>
                <strong>
                    {{ entry.hours }} hours
                </strong>
            </p>

            <p>
                Sleep Quality: {{ entry.quality }}/5
            </p>

            <small>
                {{ entry.created_at }}
            </small>

        </div>

        <hr>

    {% empty %}

        <p>No sleep records yet.</p>

    {% endfor %}

    <br>

    <a href="{% url 'dashboard' %}">
        Back to Dashboard
    </a>

</body>

</html>
